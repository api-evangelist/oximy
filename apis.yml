name: Oximy
description: >-
  Oximy is an AI adoption and governance platform — "the AI adoption engine for
  every company." It gives organizations visibility into how their people and
  applications use AI tools across the enterprise (tracking thousands of AI tools
  across categories), surfaces risks and recommendations, and lets teams ask
  natural-language questions about their AI usage. For developers, Oximy ships a
  Public API (https://api.oximy.com) and an official TypeScript SDK that wrap any
  OpenAI-compatible client to capture zero-overhead LLM telemetry and enforce
  usage policy inline — PII detection and redaction, prompt-injection detection,
  deny/allow lists, and token/cost/rate limits. Backed by Y Combinator (W26) and
  Blume Ventures; founded by Naman Ambavi.
